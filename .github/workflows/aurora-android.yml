name: Aurora VPN (Android)

# 构建流程:
# 1. runner 上构建 sing-box libbox.aar (gomobile + NDK)
# 2. 编译 release APK
# 3. APK 以 GitHub Release 形式发布(不走 artifact,避免存储配额限制)
#    - push 到 main: 发布/替换 tag "nightly" 的 Release
#    - push tag v*: 发布正式版本 Release
on:
  push:
    branches: [main]
    paths:
      - 'aurora-vpn/**'
      - '.github/workflows/aurora-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build libbox.aar
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          mkdir -p "$GITHUB_WORKSPACE/aurora-vpn/app/libs"
          cd /tmp/sing-box
          go get golang.org/x/mobile/cmd/gobind
          gomobile bind -v \
            -androidapi 23 \
            -javapkg io.nekohasekai \
            -target android/arm64,android/arm \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.14.2 -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1 -s -w -buildid= -checklinkname=0" \
            -o "$GITHUB_WORKSPACE/aurora-vpn/app/libs/libbox.aar" \
            github.com/sagernet/sing-box/experimental/libbox
          ls -lh "$GITHUB_WORKSPACE/aurora-vpn/app/libs/libbox.aar"

      - name: Assemble release APK
        working-directory: aurora-vpn
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find aurora-vpn/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload to Release (nightly)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            自动构建:main 分支最新提交 ${{ github.sha }}

            安装包:APK(直接下载安装,覆盖旧版本)。
            构建时间 ${{ github.event.head_commit.timestamp }}。
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true

      - name: Upload to Release (versioned)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
